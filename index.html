<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Font ("Risque", "Open Sans") -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Risque&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
      integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- style.css -->
    <link rel="stylesheet" href="style.css" />
    <title>Music-Player-Practice</title>
  </head>
  <body>
    <div class="container">
      <div id="music-app">
        <div class="card border-black border-1 shadow">
          <img class="card-img-top" src="img/1.jpeg" alt="" />
          <div class="card-body">
            <div class="song-details text-center">
              <div class="title my-3">Yakar Geçerim - Ajda Pekkan</div>
              <div class="singer my-3">Ajda Pekkan</div>
            </div>
            <div class="song-progress">
              <div class="progress-bar my-2">
                <input type="range" value="0" />
              </div>
              <div class="progress-details">
                <div class="d-flex justify-content-between align-items-center">
                  <span>0:00</span>
                  <span>3:11</span>
                </div>
              </div>
            </div>
            <div class="controls my-3">
              <div class="d-flex justify-content-evenly align-items-center">
                <button
                  class="btn btn-sm rounded-circle btn-primary"
                  title="Previous"
                >
                  <i class="fa-solid fa-backward"></i>
                </button>
                <div class="d-flex gap-2">
                  <button
                    class="btn btn-lg rounded-pill btn-primary"
                    title="Play"
                  >
                    <i class="fa-solid fa-play"></i>
                  </button>
                  <button
                    class="btn btn-lg rounded-pill btn-primary"
                    title="Stop"
                  >
                    <i class="fa-solid fa-stop"></i>
                  </button>
                </div>
                <button
                  class="btn btn-sm rounded-circle btn-primary"
                  title="Next"
                >
                  <i class="fa-solid fa-forward"></i>
                </button>
              </div>
            </div>
          </div>
          <div class="card-footer py-2">
            <div
              class="footer-buttons d-flex justify-content-between align-items-center"
            >
              <button
                class="btn btn-sm"
                data-bs-toggle="collapse"
                data-bs-target="#song-list"
                title="Song List"
              >
                <i class="fa-solid fa-list"></i>
              </button>
              <div class="d-flex w-50 justify-content-end gap-2">
                <button class="btn btn-sm rounded-circle" title="Repeat">
                  <i class="fa-solid fa-repeat"></i>
                </button>
                <button class="btn btn-sm rounded-circle" title="Volume">
                  <i class="fa-solid fa-volume"></i>
                </button>
                <input class="w-50" type="range" value="100" />
              </div>
            </div>
          </div>
          <div id="song-list" class="collapse show">
            <ul class="list-group list-group-flush py-1">
              <li
                class="list-group-item d-flex justify-content-between align-items-center"
              >
                <span>Yakar Geçerim - Ajda Pekkan</span>
                <span class="badge text-bg-primary rounded-pill">3:11</span>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <!-- Bootsrap Bundle -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
      integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <!-- music.js -->
    <script src="js/music.js"></script>
    <script src="js/data.js"></script>
    <script src="js/music-player.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
